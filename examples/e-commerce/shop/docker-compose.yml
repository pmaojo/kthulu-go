version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=shop
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - shop-network


volumes:
  shop-data:

networks:
  shop-network:
    driver: bridge

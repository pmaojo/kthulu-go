version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=workshop-api
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - workshop-api-network
    depends_on:
      - postgres


  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB=workshop-api
      POSTGRES_USER=admin
      POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    networks:
      - workshop-api-network
    volumes:
      - workshop-api-data:/var/lib/postgres

volumes:
  workshop-api-data:

networks:
  workshop-api-network:
    driver: bridge

version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=feature-tour
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - feature-tour-network


volumes:
  feature-tour-data:

networks:
  feature-tour-network:
    driver: bridge

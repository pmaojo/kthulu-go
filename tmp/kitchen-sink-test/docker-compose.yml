version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=kitchen-sink-test
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - kitchen-sink-test-network


volumes:
  kitchen-sink-test-data:

networks:
  kitchen-sink-test-network:
    driver: bridge

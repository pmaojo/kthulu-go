version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=gap-test
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - gap-test-network


volumes:
  gap-test-data:

networks:
  gap-test-network:
    driver: bridge

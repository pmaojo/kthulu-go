version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=tournament-api
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - tournament-api-network


volumes:
  tournament-api-data:

networks:
  tournament-api-network:
    driver: bridge

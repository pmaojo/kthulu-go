version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=airbnb-clone
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - airbnb-clone-network


volumes:
  airbnb-clone-data:

networks:
  airbnb-clone-network:
    driver: bridge

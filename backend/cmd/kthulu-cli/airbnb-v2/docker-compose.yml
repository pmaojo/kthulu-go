version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=airbnb-v2
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - airbnb-v2-network


volumes:
  airbnb-v2-data:

networks:
  airbnb-v2-network:
    driver: bridge

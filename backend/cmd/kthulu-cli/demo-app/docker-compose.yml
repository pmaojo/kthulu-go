version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=demo-app
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - demo-app-network


volumes:
  demo-app-data:

networks:
  demo-app-network:
    driver: bridge

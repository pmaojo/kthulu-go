name: airbnb-v2
description: Schema Driven Airbnb Clone
template: microservice
modules:
  property:
    fields:
      - Title:string
      - Description:string
      - Price:float64
      - Location:string
      - HostID:uint
      - ImageURL:string
  booking:
    fields:
      - PropertyID:uint
      - GuestID:uint
      - CheckIn:time.Time
      - CheckOut:time.Time
      - TotalPrice:float64
      - Status:string
  review:
    fields:
      - BookingID:uint
      - Rating:int
      - Comment:string
features:
  - user
  - auth
database: sqlite
frontend: react
auth: jwt

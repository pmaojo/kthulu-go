version: 1
git:
  depth: 1
builds:
  - id: kthulu-cli
    dir: backend/backend
    main: ./cmd/kthulu-cli
    binary: kthulu-cli
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/pmaojo/kthulu-go/backend/cmd/kthulu-cli/cmd.version={{.Version}}
      - -X github.com/pmaojo/kthulu-go/backend/cmd/kthulu-cli/cmd.build={{.Date}}

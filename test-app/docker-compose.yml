version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=0
      - DB_NAME=test-app
      - DB_USER=admin
      - DB_PASSWORD=password
    networks:
      - test-app-network


volumes:
  test-app-data:

networks:
  test-app-network:
    driver: bridge
